name: Extract workbook for analysis

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python tools/extract_workbook.py
      - name: Upload extracted sheets
        uses: actions/upload-artifact@v4
        with:
          name: extracted-workbook
          path: extracted/
